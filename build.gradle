plugins {
    id 'java'
    id 'java-library'
    id 'org.springframework.boot' version '3.2.2' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

allprojects {
    group = 'com.biztalk'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17) // Java 17로 가이드
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }
}

project(':biztalk-core') {
    bootJar { enabled = false }
    jar { enabled = true }

    dependencies {
        api 'org.springframework.boot:spring-boot-starter-amqp'
        api 'org.springframework.boot:spring-boot-starter-data-redis'
        api 'org.springframework.boot:spring-boot-starter-json'
        api 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
        api 'org.springframework.boot:spring-boot-starter-webflux'
        api 'io.projectreactor.rabbitmq:reactor-rabbitmq:1.5.6'

        // 테스트 의존성
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }
}

project(':biztalk-api') {
    dependencies {
        implementation project(':biztalk-core')
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'io.micrometer:micrometer-registry-prometheus'
    }
}

project(':biztalk-engine') {
    dependencies {
        implementation project(':biztalk-core')
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'io.micrometer:micrometer-registry-prometheus'
        implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.2.0'
        implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
        // 1. Spring WebFlux (WebClient 및 Reactive Web Server 지원)
        implementation 'org.springframework.boot:spring-boot-starter-webflux'

    }
}

project(':biztalk-webhook') {
    dependencies {
        implementation project(':biztalk-core')
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.2.0'
        implementation 'io.micrometer:micrometer-registry-prometheus'
    }
}

project(':biztalk-retry') {
    dependencies {
        implementation project(':biztalk-core')
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'io.micrometer:micrometer-registry-prometheus'
    }
}

project(':biztalk-mockserver') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'io.micrometer:micrometer-registry-prometheus'
    }
}