version: '3.8'

networks:
  biztalk-net:
    driver: bridge

services:
  # 1. MariaDB (영구 데이터 저장소)
  mariadb:
    build:
      context: ./infra/mariadb
      dockerfile: Dockerfile
    container_name: biztalk-mariadb
    ports:
      - "3307:3307"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ums_db
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./infra/mariadb/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biztalk-net

  # 2. Redis (멱등성 검증 및 Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: biztalk-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - biztalk-net

  # 3. RabbitMQ (메시지 브로커 / EDA 파이프라인)
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: biztalk-rabbitmq
    ports:
      - "5672:5672"     # AMQP Protocol
      - "15672:15672"   # Management UI
      - "15692:15692"   # Prometheus Metrics
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biztalk-net

  # 4. Mock Server (외부 연동 시뮬레이션)
  biztalk-mockserver:
    build:
      context: .
      dockerfile: ./biztalk-mockserver/Dockerfile
    container_name: biztalk-mockserver
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
    networks:
      - biztalk-net

  # 5. Producer API 모듈
  biztalk-api:
    build:
      context: .
      dockerfile: ./biztalk-api/Dockerfile
    container_name: biztalk-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/ums_db?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - biztalk-net

  # 6. Consumer Engine 모듈
  biztalk-engine:
    build:
      context: .
      dockerfile: ./biztalk-engine/Dockerfile
    container_name: biztalk-engine
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/ums_db?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - MOCK_SERVER_URL=http://biztalk-mockserver:8085
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      biztalk-mockserver:
        condition: service_started
    networks:
      - biztalk-net

volumes:
  mariadb_data: