version: '3.8'

networks:
  biztalk-net:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: biztalk-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
      - "15692:15692"  # Prometheus Metrics
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biztalk-net

  redis:
    image: redis:alpine
    container_name: biztalk-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - biztalk-net

  biztalk-mockserver:
    build:
      context: .
      dockerfile: ./biztalk-mockserver/Dockerfile
    container_name: biztalk-mockserver
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
    networks:
      - biztalk-net

  biztalk-api:
    build:
      context: .
      dockerfile: ./biztalk-api/Dockerfile
    container_name: biztalk-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_REDIS_HOST=redis
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - biztalk-net

  biztalk-engine:
    build:
      context: .
      dockerfile: ./biztalk-engine/Dockerfile
    container_name: biztalk-engine
    ports:
      - "8081:8081"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_REDIS_HOST=redis
      - MOCK_SERVER_URL=http://biztalk-mockserver:8085
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      biztalk-mockserver:
        condition: service_started
    networks:
      - biztalk-net

  prometheus:
    image: prom/prometheus:latest
    container_name: biztalk-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - biztalk-net

  grafana:
    image: grafana/grafana
    container_name: biztalk-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - biztalk-net