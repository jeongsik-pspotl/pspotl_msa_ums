# 5. Biztalk Engine
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biztalk-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biztalk-engine
  template:
    metadata:
      labels:
        app: biztalk-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: biztalk-engine
          image: biztalk-engine:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "800m"
              memory: "1Gi"
          env:
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
            - name: SPRING_REDIS_HOST
              value: "redis"
