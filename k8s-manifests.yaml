apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - "/etc/prometheus/alert.rules.yml"

    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)

      - job_name: 'rabbitmq'
        static_configs:
          - targets: ['rabbitmq:15692']

  alert.rules.yml: |
    groups:
      - name: biztalk-alert-rules
        rules:
          - alert: RabbitMQQueueBacklogHigh
            expr: rabbitmq_queue_messages_ready{queue="alimtalk.queue"} > 10000
            for: 10s
            labels:
              severity: critical
            annotations:
              summary: "RabbitMQ Alimtalk Queue Message Backlog Spike"
              description: "Alimtalk Queue Ready Messages exceed 10,000 (Current value: {{ $value }})"

          - alert: HighErrorRate5xx
            expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m])) / sum(rate(http_server_requests_seconds_count[1m])) * 100 > 5
            for: 15s
            labels:
              severity: warning
            annotations:
              summary: "High HTTP 5xx Error Rate Detected"
              description: "HTTP 5xx Error Rate is above 5% over the last 1 minute."

          - alert: ServicePodDown
            expr: up{job="spring-boot-app"} == 0
            for: 10s
            labels:
              severity: critical
            annotations:
              summary: "Biztalk Spring Boot Instance Down"
              description: "Spring Boot Actuator Scrape Failed on instance {{ $labels.instance }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-channels
data:
  alerting.yaml: |
    apiVersion: 1
    contactPoints:
      - name: 'Biztalk-Ops-Team'
        receivers:
          - type: webhook
            settings:
              url: 'http://biztalk-mockserver:8085/api/v1/mock/alert-receiver'
    policies:
      - orgId: 1
        receiver: 'Biztalk-Ops-Team'
        groupWait: 10s
        groupInterval: 30s
        repeatInterval: 1h
---
# 1. RabbitMQ
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
            - containerPort: 15672
            - containerPort: 15692
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
            - name: RABBITMQ_DEFAULT_PASS
              value: "guest"
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
    - name: metrics
      port: 15692
      targetPort: 15692
---
# 2. Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# 3. Biztalk Mockserver
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biztalk-mockserver
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biztalk-mockserver
  template:
    metadata:
      labels:
        app: biztalk-mockserver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8085"
    spec:
      containers:
        - name: biztalk-mockserver
          image: biztalk-mockserver:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          resources:
            requests: # <-- 이 영역이 필수입니다!
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "700m"
              memory: "1Gi"
          env:
            - name: SERVER_PORT
              value: "8085"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: biztalk-mockserver
spec:
  selector:
    app: biztalk-mockserver
  ports:
    - port: 8085
      targetPort: 8085
---
